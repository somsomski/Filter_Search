<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Filtro Lookup (AR)</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; 
      margin: 0;
      padding: 24px;
      background: #fafafa;
      color: #333;
      line-height: 1.6;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { 
      font-size: 28px; 
      font-weight: 600; 
      margin: 0 0 24px 0;
      color: #1a1a1a;
    }
    .search-form { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 24px; 
      flex-wrap: wrap;
    }
    input, button { 
      padding: 12px 16px; 
      font-size: 15px; 
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
    }
    input {
      flex: 1;
      min-width: 150px;
      background: white;
    }
    input:focus {
      outline: none;
      border-color: #4a90e2;
    }
    button { 
      background: #4a90e2;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 500;
      padding: 12px 24px;
      transition: background 0.2s;
    }
    button:hover { background: #357abd; }
    button:active { background: #2a5f8f; }
    .card { 
      background: white;
      border: 1px solid #e0e0e0; 
      border-radius: 8px; 
      padding: 20px; 
      margin-bottom: 16px;
    }
    h2 { 
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 16px 0;
      color: #1a1a1a;
    }
    .result-item {
      padding: 16px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .result-item:last-child {
      border-bottom: none;
    }
    .result-item:first-child {
      padding-top: 0;
    }
    .part-number {
      font-size: 17px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .confidence {
      display: inline-block;
      font-size: 13px;
      color: #666;
      margin-left: 8px;
      font-weight: normal;
    }
    .sources {
      font-size: 13px;
      color: #888;
      margin: 8px 0;
    }
    .notes {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }
    .notes small {
      display: block;
      margin-top: 4px;
    }
    .chip { 
      display: inline-block; 
      background: #f0f0f0; 
      border: 1px solid #ddd; 
      border-radius: 4px; 
      padding: 6px 12px; 
      margin: 4px 4px 4px 0; 
      font-size: 13px; 
      cursor: pointer;
      transition: background 0.2s;
    }
    .chip:hover { background: #e0e0e0; }
    .chip::after { content: ' ×'; color: #999; margin-left: 6px; }
    .empty-section { 
      color: #999; 
      text-align: center; 
      padding: 40px 20px;
      font-size: 14px;
    }
    .model-input-wrapper { 
      position: relative; 
      display: inline-block;
      flex: 1;
      min-width: 150px;
    }
    .suggestions-dropdown { 
      position: absolute; 
      top: 100%; 
      left: 0; 
      right: 0; 
      background: white; 
      border: 1px solid #ddd; 
      border-top: none; 
      border-radius: 0 0 6px 6px; 
      max-height: 200px; 
      overflow-y: auto; 
      z-index: 1000; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: none;
    }
    .suggestions-dropdown.show { display: block; }
    .suggestion-item { 
      padding: 10px 16px; 
      cursor: pointer; 
      border-bottom: 1px solid #f5f5f5; 
      transition: background 0.15s;
    }
    .suggestion-item:hover { background: #f8f8f8; }
    .suggestion-item:last-child { border-bottom: none; }
    .xref-toggle { 
      cursor: pointer; 
      color: #4a90e2; 
      text-decoration: none;
      font-size: 13px;
      margin-top: 8px;
      display: inline-block;
    }
    .xref-toggle:hover {
      text-decoration: underline;
    }
    .xref-content { 
      display: none; 
      margin-top: 12px; 
      padding: 12px; 
      background: #f8f8f8; 
      border-radius: 4px; 
      font-size: 13px;
    }
    .xref-content.show { display: block; }
    .xref-producer {
      margin: 6px 0;
    }
    .xref-producer strong {
      color: #4a90e2;
      margin-right: 8px;
    }
    .disclaimer {
      margin-top: 32px;
      padding: 16px;
      background: #fff9e6;
      border-left: 3px solid #ffc107;
      border-radius: 4px;
      font-size: 12px;
      color: #856404;
      line-height: 1.5;
    }
    .ask-card {
      background: #fff9e6;
      border-left: 3px solid #ff9800;
    }
    .ask-card button {
      margin: 8px 8px 8px 0;
      background: white;
      color: #333;
      border: 1px solid #ddd;
    }
    .ask-card button:hover {
      background: #f5f5f5;
    }
    .hints-card {
      background: #f0f7ff;
      border-left: 3px solid #4a90e2;
    }
  </style>
</head>
<body>
  <h1>Buscador de filtros</h1>
  <div class="search-form">
    <div class="model-input-wrapper">
      <input id="make" placeholder="Marca" autocomplete="off" />
      <div id="make-suggestions" class="suggestions-dropdown"></div>
    </div>
    <div class="model-input-wrapper">
      <input id="model" placeholder="Modelo" autocomplete="off" />
      <div id="model-suggestions" class="suggestions-dropdown"></div>
    </div>
    <input id="year" type="number" placeholder="Año" style="width: 100px;" />
    <button id="btn">Buscar</button>
  </div>

  <div id="ask" class="card ask-card" style="display:none"></div>
  <div id="hints" class="card hints-card" style="display:none"></div>
  <div id="out"></div>
  <div class="disclaimer">
    Todos los datos sobre filtros y sus análogos provienen de catálogos de fabricantes, tienen carácter informativo, no se garantiza su exactitud y la responsabilidad por el uso recae en el usuario.
  </div>

  <script>
    const $ = (s)=>document.querySelector(s);
    const api = (path)=>path;
    
    let currentQuery = {};
    let suggestionTimeout = null;
    let makeSuggestionTimeout = null;
    
    // Автокомплит для марок
    async function loadMakeSuggestions() {
      const make = $('#make').value.trim();
      const suggestionsDiv = $('#make-suggestions');
      
      try {
        const resp = await fetch(api(`/api/suggest-makes?makePrefix=${encodeURIComponent(make)}&limit=100`));
        const data = await resp.json();
        
        if (data.suggestions && data.suggestions.length > 0) {
          suggestionsDiv.innerHTML = '';
          data.suggestions.forEach(suggestion => {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.textContent = suggestion;
            item.onclick = () => {
              $('#make').value = suggestion;
              suggestionsDiv.classList.remove('show');
              // Перезагружаем предложения моделей после выбора марки
              loadModelSuggestions();
            };
            suggestionsDiv.appendChild(item);
          });
          suggestionsDiv.classList.add('show');
        } else {
          suggestionsDiv.classList.remove('show');
        }
      } catch (e) {
        console.error('Error loading make suggestions:', e);
        suggestionsDiv.classList.remove('show');
      }
    }
    
    // Автокомплит для моделей
    async function loadModelSuggestions() {
      const make = $('#make').value.trim();
      const model = $('#model').value.trim();
      const suggestionsDiv = $('#model-suggestions');
      
      // Если марка не указана, скрываем предложения
      if (!make) {
        suggestionsDiv.classList.remove('show');
        return;
      }
      
      try {
        const resp = await fetch(api(`/api/suggest-models?make=${encodeURIComponent(make)}&modelPrefix=${encodeURIComponent(model)}`));
        const data = await resp.json();
        
        if (data.suggestions && data.suggestions.length > 0) {
          suggestionsDiv.innerHTML = '';
          data.suggestions.forEach(suggestion => {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.textContent = suggestion;
            item.onclick = () => {
              $('#model').value = suggestion;
              suggestionsDiv.classList.remove('show');
            };
            suggestionsDiv.appendChild(item);
          });
          suggestionsDiv.classList.add('show');
        } else {
          suggestionsDiv.classList.remove('show');
        }
      } catch (e) {
        console.error('Error loading model suggestions:', e);
        suggestionsDiv.classList.remove('show');
      }
    }
    
    // Обработчик ввода в поле марки
    $('#make').addEventListener('input', () => {
      // Задержка перед запросом (debounce)
      if (makeSuggestionTimeout) {
        clearTimeout(makeSuggestionTimeout);
      }
      makeSuggestionTimeout = setTimeout(() => {
        loadMakeSuggestions();
      }, 300);
    });
    
    // Обработчик ввода в поле модели
    $('#model').addEventListener('input', () => {
      // Задержка перед запросом (debounce)
      if (suggestionTimeout) {
        clearTimeout(suggestionTimeout);
      }
      suggestionTimeout = setTimeout(() => {
        loadModelSuggestions();
      }, 300);
    });
    
    // Скрываем предложения при клике вне области
    document.addEventListener('click', (e) => {
      const wrappers = document.querySelectorAll('.model-input-wrapper');
      let clickedInside = false;
      wrappers.forEach(wrapper => {
        if (wrapper.contains(e.target)) {
          clickedInside = true;
        }
      });
      if (!clickedInside) {
        $('#make-suggestions').classList.remove('show');
        $('#model-suggestions').classList.remove('show');
      }
    });
    
    // Показываем предложения при фокусе на поле марки
    $('#make').addEventListener('focus', () => {
      loadMakeSuggestions();
    });
    
    // Показываем предложения при фокусе на поле модели
    $('#model').addEventListener('focus', () => {
      const make = $('#make').value.trim();
      if (make) {
        loadModelSuggestions();
      }
    });
    
    // Скрываем предложения при нажатии Enter
    $('#make').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        $('#make-suggestions').classList.remove('show');
      }
    });
    
    $('#model').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        $('#model-suggestions').classList.remove('show');
      }
    });
    
    async function run(hints = {}) {
      // Скрываем предложения при поиске
      $('#make-suggestions').classList.remove('show');
      $('#model-suggestions').classList.remove('show');
      const make = $('#make').value.trim();
      const model = $('#model').value.trim();
      const year = Number($('#year').value);
      const lang = 'es-AR';
      
      currentQuery = { make, model, year, lang, hints };
      
      const resp = await fetch(api('/api/lookup'), {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(currentQuery)
      });
      const data = await resp.json();
      
      const ask = document.getElementById('ask');
      ask.style.display = 'none';
      ask.innerHTML = '';
      
      if (data.disambiguation?.needed) {
        ask.style.display = 'block';
        const q = data.disambiguation.ask?.[0];
        const txt = data.disambiguation.fallback_texts?.['es-AR'] || 'Falta un dato';
        
        let askHTML = `<div style="margin-bottom: 12px;"><strong>${txt}</strong></div>`;
        if (q?.reason) {
          askHTML += `<div style="margin-bottom: 16px; color: #666; font-size: 14px;">${q.reason}</div>`;
        }
        
        if (q?.field === 'fuel') {
          askHTML += '<div>';
          askHTML += '<button onclick="answerFuel(\'nafta\')">Nafta</button>';
          askHTML += '<button onclick="answerFuel(\'diesel\')">Diesel</button>';
          askHTML += '</div>';
        } else if (q?.field === 'ac') {
          askHTML += '<div>';
          askHTML += '<button onclick="answerAC(false)">Estándar (CU)</button>';
          askHTML += '<button onclick="answerAC(true)">Carbón activo/bio (CUK/FP)</button>';
          askHTML += '</div>';
        } else if (q?.field === 'displacement_l') {
          askHTML += '<div>';
          if (q.options && q.options.length > 0) {
            q.options.forEach(option => {
              askHTML += `<button onclick="answerDisplacement(${option})">${option}L</button>`;
            });
          } else {
            askHTML += '<input id="displacementInput" type="number" step="0.1" placeholder="ej: 1.6" style="margin-right:8px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"/>';
            askHTML += '<button onclick="answerDisplacement()">Confirmar</button>';
          }
          askHTML += '</div>';
        } else if (q?.field === 'engine_series') {
          askHTML += '<div>';
          if (q.options && q.options.length > 0) {
            q.options.forEach(option => {
              const escapedOption = String(option).replace(/'/g, "\\'").replace(/"/g, '&quot;');
              askHTML += `<button onclick="answerEngineSeries('${escapedOption}')">${String(option)}</button>`;
            });
          } else {
            askHTML += '<input id="engineSeriesInput" placeholder="ej: TBI 16V" style="margin-right:8px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"/>';
            askHTML += '<button onclick="answerEngineSeries()">Confirmar</button>';
          }
          askHTML += '</div>';
        } else if (q?.field === 'power_hp') {
          askHTML += '<div>';
          if (q.options && q.options.length > 0) {
            q.options.forEach(option => {
              askHTML += `<button onclick="answerPowerHp(${option})">${option} HP</button>`;
            });
          } else {
            askHTML += '<input id="powerHpInput" type="number" placeholder="ej: 115" style="margin-right:8px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"/>';
            askHTML += '<button onclick="answerPowerHp()">Confirmar</button>';
          }
          askHTML += '</div>';
        } else if (q?.field === 'engine_code') {
          askHTML += '<div>';
          if (q.options && q.options.length > 0) {
            q.options.forEach(option => {
              const escapedOption = String(option).replace(/'/g, "\\'").replace(/"/g, '&quot;');
              askHTML += `<button onclick="answerEngineCode('${escapedOption}')">${String(option)}</button>`;
            });
          } else {
            askHTML += '<input id="engineCodeInput" placeholder="ej: EC5" style="margin-right:8px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"/>';
            askHTML += '<button onclick="answerEngineCode()">Confirmar</button>';
          }
          askHTML += '</div>';
        } else if (q?.field === 'body') {
          askHTML += '<div>';
          if (q.options && q.options.length > 0) {
            q.options.forEach(option => {
              const escapedOption = String(option).replace(/'/g, "\\'").replace(/"/g, '&quot;');
              askHTML += `<button onclick="answerBody('${escapedOption}')">${String(option)}</button>`;
            });
          } else {
            askHTML += '<input id="bodyInput" placeholder="ej: HB" style="margin-right:8px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"/>';
            askHTML += '<button onclick="answerBody()">Confirmar</button>';
          }
          askHTML += '</div>';
        }
        
        ask.innerHTML = askHTML;
      }
      
      // Показываем активные hints
      const hintsDiv = document.getElementById('hints');
      hintsDiv.style.display = 'none';
      hintsDiv.innerHTML = '';
      
      if (hints && Object.keys(hints).length > 0) {
        hintsDiv.style.display = 'block';
        let hintsHTML = '<div style="margin-bottom: 12px; font-weight: 500;">Filtros activos:</div><div>';
        
        if (hints.fuel) {
          hintsHTML += `<span class="chip" onclick="clearHint('fuel')">Combustible: ${hints.fuel}</span>`;
        }
        if (hints.ac !== undefined) {
          const acLabel = hints.ac ? 'Carbón activo/bio (CUK/FP)' : 'Estándar (CU)';
          hintsHTML += `<span class="chip" onclick="clearHint('ac')">Aire acondicionado: ${acLabel}</span>`;
        }
        if (hints.displacement_l) {
          hintsHTML += `<span class="chip" onclick="clearHint('displacement_l')">Cilindrada: ${hints.displacement_l}L</span>`;
        }
        if (hints.engine_series) {
          hintsHTML += `<span class="chip" onclick="clearHint('engine_series')">Serie motor: ${hints.engine_series}</span>`;
        }
        if (hints.power_hp) {
          hintsHTML += `<span class="chip" onclick="clearHint('power_hp')">Potencia: ${hints.power_hp} HP</span>`;
        }
        if (hints.engine_code) {
          hintsHTML += `<span class="chip" onclick="clearHint('engine_code')">Código motor: ${hints.engine_code}</span>`;
        }
        if (hints.body) {
          hintsHTML += `<span class="chip" onclick="clearHint('body')">Carrocería: ${hints.body}</span>`;
        }
        
        hintsHTML += '</div>';
        hintsDiv.innerHTML = hintsHTML;
      }
      
      const out = document.getElementById('out');
      out.innerHTML = '';
      
      function formatXref(xrefStr) {
        if (!xrefStr) return '';
        
        // Группируем по производителям
        const groups = new Map();
        const parts = xrefStr.split(',').map(p => p.trim()).filter(p => p);
        
        for (const part of parts) {
          const colonIndex = part.indexOf(':');
          if (colonIndex === -1) continue;
          
          const producer = part.substring(0, colonIndex).trim();
          const partNum = part.substring(colonIndex + 1).trim();
          
          if (!groups.has(producer)) {
            groups.set(producer, []);
          }
          groups.get(producer).push(partNum);
        }
        
        if (groups.size === 0) return '';
        
        // Сортируем производителей по алфавиту
        const sortedProducers = Array.from(groups.keys()).sort();
        
        // Генерируем уникальный ID для этого xref
        const xrefId = 'xref-' + Math.random().toString(36).substr(2, 9);
        
        // Форматируем вывод с выпадающим списком
        let html = '<div style="margin-top: 8px;">';
        html += `<span class="xref-toggle" onclick="toggleXref('${xrefId}')">Ver referencias cruzadas</span>`;
        html += `<div id="${xrefId}" class="xref-content">`;
        
        for (const producer of sortedProducers) {
          const partNums = groups.get(producer);
          html += `<div class="xref-producer">`;
          html += `<strong>${producer}</strong>`;
          html += `<span>${partNums.join(', ')}</span>`;
          html += `</div>`;
        }
        
        html += '</div></div>';
        return html;
      }
      
      window.toggleXref = function(xrefId) {
        const content = document.getElementById(xrefId);
        if (content) {
          content.classList.toggle('show');
        }
      };
      
      function section(title, items) {
        const div = document.createElement('div'); 
        div.className='card';
        
        if (!items || !items.length) {
          div.innerHTML = `<h2>${title}</h2><div class="empty-section">Sin entradas</div>`;
        } else {
          div.innerHTML = `<h2>${title}</h2>` + items.map(it => {
            const srcs = (it.sources||[]).map(s=>`${s.catalog} p.${s.page}`).join(', ');
            let notesHtml = '';
            
            // Комментарий всегда показываем
            if (it.comment) {
              notesHtml += `<div class="notes"><small>${it.comment}</small></div>`;
            }
            
            // Дата показываем только если есть
            if (it.date) {
              notesHtml += `<div class="notes"><small>${it.date}</small></div>`;
            }
            
            // xref форматируем с группировкой по производителям
            if (it.xref) {
              notesHtml += formatXref(it.xref);
            }
            
            return `<div class="result-item">
              <div class="part-number">${it.brand} ${it.part_number}<span class="confidence">${Math.round(it.confidence*100)}%</span></div>
              <div class="sources">${srcs}</div>
              ${notesHtml}
            </div>`;
          }).join('');
        }
        out.appendChild(div);
      }
      
      section('Aceite', data.results?.oil);
      section('Aire', data.results?.air);
      section('Cabina', data.results?.cabin);
      section('Combustible', data.results?.fuel);
      
      // Автоскролл к результатам после ответа на дизамбигуацию
      if (hints && Object.keys(hints).length > 0) {
        setTimeout(() => {
          document.getElementById('out').scrollIntoView({ behavior: 'smooth' });
        }, 100);
      }
    }
    
    function answerFuel(fuel) {
      run({ ...currentQuery.hints, fuel });
    }
    
    function answerAC(ac) {
      run({ ...currentQuery.hints, ac });
    }
    
    function answerDisplacement(displacement) {
      if (displacement !== undefined) {
        run({ ...currentQuery.hints, displacement_l: displacement });
      } else {
        const displacementValue = Number($('#displacementInput').value);
        if (displacementValue && displacementValue > 0) {
          run({ ...currentQuery.hints, displacement_l: displacementValue });
        }
      }
    }
    
    function answerEngineSeries(series) {
      if (series) {
        run({ ...currentQuery.hints, engine_series: series });
      } else {
        const inputSeries = $('#engineSeriesInput').value.trim();
        if (inputSeries) {
          run({ ...currentQuery.hints, engine_series: inputSeries });
        }
      }
    }
    
    function answerPowerHp(powerHp) {
      if (powerHp !== undefined) {
        run({ ...currentQuery.hints, power_hp: powerHp });
      } else {
        const powerHpValue = Number($('#powerHpInput').value);
        if (powerHpValue && powerHpValue > 0) {
          run({ ...currentQuery.hints, power_hp: powerHpValue });
        }
      }
    }
    
    function answerEngineCode(engineCode) {
      if (engineCode) {
        run({ ...currentQuery.hints, engine_code: engineCode });
      } else {
        const inputCode = $('#engineCodeInput').value.trim();
        if (inputCode) {
          run({ ...currentQuery.hints, engine_code: inputCode });
        }
      }
    }
    
    function answerBody(body) {
      if (body) {
        run({ ...currentQuery.hints, body: body });
      } else {
        const inputBody = $('#bodyInput').value.trim();
        if (inputBody) {
          run({ ...currentQuery.hints, body: inputBody });
        }
      }
    }
    
    function clearHint(hintName) {
      const newHints = { ...currentQuery.hints };
      delete newHints[hintName];
      run(newHints);
    }
    
    document.getElementById('btn').addEventListener('click', () => run());
    
    // Поиск по Enter
    ['make', 'model', 'year'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          run();
        }
      });
    });
  </script>
</body>
</html>
