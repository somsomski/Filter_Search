<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Filtro Lookup (AR)</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 20px; }
    .row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    input, select, button { padding:8px; font-size:16px; }
    .card { border:1px solid #ddd; border-radius:10px; padding:12px; margin:10px 0; }
    h2 { margin: 12px 0 6px; }
    small { color:#666; }
    .chip { display:inline-block; background:#e3f2fd; border:1px solid #2196f3; border-radius:16px; padding:4px 12px; margin:2px; font-size:14px; cursor:pointer; }
    .chip:hover { background:#bbdefb; }
    .chip::after { content: ' ×'; color:#666; margin-left:4px; }
    .empty-section { color:#999; font-style:italic; text-align:center; padding:20px; }
    .model-input-wrapper { position:relative; display:inline-block; }
    .suggestions-dropdown { 
      position:absolute; 
      top:100%; 
      left:0; 
      right:0; 
      background:white; 
      border:1px solid #ccc; 
      border-top:none; 
      border-radius:0 0 4px 4px; 
      max-height:200px; 
      overflow-y:auto; 
      z-index:1000; 
      box-shadow:0 4px 6px rgba(0,0,0,0.1);
      display:none;
    }
    .suggestions-dropdown.show { display:block; }
    .suggestion-item { 
      padding:8px 12px; 
      cursor:pointer; 
      border-bottom:1px solid #eee; 
    }
    .suggestion-item:hover { background:#f5f5f5; }
    .suggestion-item:last-child { border-bottom:none; }
  </style>
</head>
<body>
  <h1>Buscador de filtros (Argentina)</h1>
  <div class="row">
    <input id="make" placeholder="Marca (ej: Peugeot)" />
    <div class="model-input-wrapper">
      <input id="model" placeholder="Modelo (ej: 208)" autocomplete="off" />
      <div id="suggestions" class="suggestions-dropdown"></div>
    </div>
    <input id="year" type="number" placeholder="Año (ej: 2019)" />
    <select id="lang">
      <option value="es-AR" selected>es-AR</option>
      <option value="ru">ru</option>
    </select>
    <button id="btn">Buscar</button>
  </div>

  <div id="ask" class="card" style="display:none"></div>
  <div id="hints" class="card" style="display:none"></div>
  <div id="out"></div>

  <script>
    const $ = (s)=>document.querySelector(s);
    const api = (path)=>path;
    
    let currentQuery = {};
    let suggestionTimeout = null;
    
    // Автокомплит для моделей
    async function loadSuggestions() {
      const make = $('#make').value.trim();
      const model = $('#model').value.trim();
      const suggestionsDiv = $('#suggestions');
      
      // Если марка не указана, скрываем предложения
      if (!make) {
        suggestionsDiv.classList.remove('show');
        return;
      }
      
      try {
        const resp = await fetch(api(`/api/suggest-models?make=${encodeURIComponent(make)}&modelPrefix=${encodeURIComponent(model)}&limit=10`));
        const data = await resp.json();
        
        if (data.suggestions && data.suggestions.length > 0) {
          suggestionsDiv.innerHTML = '';
          data.suggestions.forEach(suggestion => {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.textContent = suggestion;
            item.onclick = () => {
              $('#model').value = suggestion;
              suggestionsDiv.classList.remove('show');
            };
            suggestionsDiv.appendChild(item);
          });
          suggestionsDiv.classList.add('show');
        } else {
          suggestionsDiv.classList.remove('show');
        }
      } catch (e) {
        console.error('Error loading suggestions:', e);
        suggestionsDiv.classList.remove('show');
      }
    }
    
    // Обработчик ввода в поле модели
    $('#model').addEventListener('input', () => {
      // Задержка перед запросом (debounce)
      if (suggestionTimeout) {
        clearTimeout(suggestionTimeout);
      }
      suggestionTimeout = setTimeout(() => {
        loadSuggestions();
      }, 300);
    });
    
    // Обработчик ввода в поле марки - перезагружаем предложения
    $('#make').addEventListener('input', () => {
      if (suggestionTimeout) {
        clearTimeout(suggestionTimeout);
      }
      suggestionTimeout = setTimeout(() => {
        loadSuggestions();
      }, 300);
    });
    
    // Скрываем предложения при клике вне области
    document.addEventListener('click', (e) => {
      const wrapper = document.querySelector('.model-input-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        $('#suggestions').classList.remove('show');
      }
    });
    
    // Показываем предложения при фокусе на поле модели
    $('#model').addEventListener('focus', () => {
      const make = $('#make').value.trim();
      if (make) {
        loadSuggestions();
      }
    });
    
    // Скрываем предложения при нажатии Enter
    $('#model').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        $('#suggestions').classList.remove('show');
      }
    });
    
    async function run(hints = {}) {
      // Скрываем предложения при поиске
      $('#suggestions').classList.remove('show');
      const make = $('#make').value.trim();
      const model = $('#model').value.trim();
      const year = Number($('#year').value);
      const lang = $('#lang').value;
      
      currentQuery = { make, model, year, lang, hints };
      
      const resp = await fetch(api('/api/lookup'), {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(currentQuery)
      });
      const data = await resp.json();
      
      const ask = document.getElementById('ask');
      ask.style.display = 'none';
      ask.innerHTML = '';
      
      if (data.disambiguation?.needed) {
        ask.style.display = 'block';
        const q = data.disambiguation.ask?.[0];
        const txt = (lang==='ru')
          ? (data.disambiguation.fallback_texts?.['ru'] || 'Нужен уточняющий пункт')
          : (data.disambiguation.fallback_texts?.['es-AR'] || 'Falta un dato');
        
        let askHTML = `<b>⚠️ ${txt}</b><br/><small>${q?.reason || ''}</small><br/>`;
        
        if (q?.field === 'fuel') {
          askHTML += '<div style="margin-top:10px;">';
          askHTML += '<button onclick="answerFuel(\'nafta\')" style="margin-right:8px;">Nafta</button>';
          askHTML += '<button onclick="answerFuel(\'diesel\')">Diesel</button>';
          askHTML += '</div>';
        } else if (q?.field === 'ac') {
          askHTML += '<div style="margin-top:10px;">';
          askHTML += '<button onclick="answerAC(false)" style="margin-right:8px;">Estándar (CU)</button>';
          askHTML += '<button onclick="answerAC(true)">Carbón activo/bio (CUK/FP)</button>';
          askHTML += '</div>';
        } else if (q?.field === 'displacement_l') {
          askHTML += '<div style="margin-top:10px;">';
          if (q.options && q.options.length > 0) {
            q.options.forEach(option => {
              askHTML += `<button onclick="answerDisplacement(${option})" style="margin-right:8px; margin-bottom:4px;">${option}L</button>`;
            });
          } else {
            askHTML += '<input id="displacementInput" type="number" step="0.1" placeholder="ej: 1.6" style="margin-right:8px;"/>';
            askHTML += '<button onclick="answerDisplacement()">Confirmar</button>';
          }
          askHTML += '</div>';
        } else if (q?.field === 'engine_series') {
          askHTML += '<div style="margin-top:10px;">';
          if (q.options && q.options.length > 0) {
            q.options.forEach(option => {
              askHTML += `<button onclick="answerEngineSeries('${option}')" style="margin-right:8px; margin-bottom:4px;">${option}</button>`;
            });
          } else {
            askHTML += '<input id="engineSeriesInput" placeholder="ej: TBI 16V" style="margin-right:8px;"/>';
            askHTML += '<button onclick="answerEngineSeries()">Confirmar</button>';
          }
          askHTML += '</div>';
        }
        
        ask.innerHTML = askHTML;
      }
      
      // Показываем активные hints
      const hintsDiv = document.getElementById('hints');
      hintsDiv.style.display = 'none';
      hintsDiv.innerHTML = '';
      
      if (hints && Object.keys(hints).length > 0) {
        hintsDiv.style.display = 'block';
        let hintsHTML = '<b>Active filters / Активные фильтры:</b><br/>';
        
        if (hints.fuel) {
          hintsHTML += `<span class="chip" onclick="clearHint('fuel')">fuel: ${hints.fuel}</span>`;
        }
        if (hints.ac !== undefined) {
          const acLabel = hints.ac ? 'Carbón activo/bio (CUK/FP)' : 'Estándar (CU)';
          hintsHTML += `<span class="chip" onclick="clearHint('ac')">ac: ${acLabel}</span>`;
        }
        if (hints.displacement_l) {
          hintsHTML += `<span class="chip" onclick="clearHint('displacement_l')">displacement_l: ${hints.displacement_l}</span>`;
        }
        if (hints.engine_series) {
          hintsHTML += `<span class="chip" onclick="clearHint('engine_series')">engine_series: ${hints.engine_series}</span>`;
        }
        
        hintsDiv.innerHTML = hintsHTML;
      }
      
      const out = document.getElementById('out');
      out.innerHTML = '';
      
      function formatXref(xrefStr) {
        if (!xrefStr) return '';
        
        // Группируем по производителям
        const groups = new Map();
        const parts = xrefStr.split(',').map(p => p.trim()).filter(p => p);
        
        for (const part of parts) {
          const colonIndex = part.indexOf(':');
          if (colonIndex === -1) continue;
          
          const producer = part.substring(0, colonIndex).trim();
          const partNum = part.substring(colonIndex + 1).trim();
          
          if (!groups.has(producer)) {
            groups.set(producer, []);
          }
          groups.get(producer).push(partNum);
        }
        
        if (groups.size === 0) return '';
        
        // Сортируем производителей по алфавиту
        const sortedProducers = Array.from(groups.keys()).sort();
        
        // Форматируем вывод
        let html = '<br/><div style="margin-top:6px; padding:8px; background:#f5f5f5; border-radius:4px;">';
        html += '<small style="color:#666; font-weight:bold;">🔗 Аналоги / Cross-references:</small><br/>';
        
        for (const producer of sortedProducers) {
          const partNums = groups.get(producer);
          html += `<div style="margin-top:4px; margin-left:12px;">`;
          html += `<strong style="color:#2196f3;">${producer}</strong>: `;
          html += `<span style="color:#555;">${partNums.join(', ')}</span>`;
          html += `</div>`;
        }
        
        html += '</div>';
        return html;
      }
      
      function section(title, items) {
        const div = document.createElement('div'); 
        div.className='card';
        
        if (!items || !items.length) {
          div.innerHTML = `<h2>${title}</h2><div class="empty-section">— No entries / Нет позиций —</div>`;
        } else {
          div.innerHTML = `<h2>${title}</h2>` + items.map(it => {
            const srcs = (it.sources||[]).map(s=>`${s.catalog} p.${s.page}`).join(', ');
            let notesHtml = '';
            
            // Комментарий всегда показываем
            if (it.comment) {
              notesHtml += `<br/><small style="color:#666;">💬 ${it.comment}</small>`;
            }
            
            // Дата показываем только если есть
            if (it.date) {
              notesHtml += `<br/><small style="color:#666;">📅 ${it.date}</small>`;
            }
            
            // xref форматируем с группировкой по производителям
            if (it.xref) {
              notesHtml += formatXref(it.xref);
            }
            
            return `<div><b>${it.brand} ${it.part_number}</b> — conf ${Math.round(it.confidence*100)}%<br/><small>${srcs}</small>${notesHtml}</div>`;
          }).join('');
        }
        out.appendChild(div);
      }
      
      section('Aceite / Масляный', data.results?.oil);
      section('Aire / Воздушный', data.results?.air);
      section('Cabina / Салонный', data.results?.cabin);
      section('Combustible / Топливный', data.results?.fuel);
      
      // Автоскролл к результатам после ответа на дизамбигуацию
      if (hints && Object.keys(hints).length > 0) {
        setTimeout(() => {
          document.getElementById('out').scrollIntoView({ behavior: 'smooth' });
        }, 100);
      }
    }
    
    function answerFuel(fuel) {
      run({ ...currentQuery.hints, fuel });
    }
    
    function answerAC(ac) {
      run({ ...currentQuery.hints, ac });
    }
    
    function answerDisplacement(displacement) {
      if (displacement !== undefined) {
        run({ ...currentQuery.hints, displacement_l: displacement });
      } else {
        const displacementValue = Number($('#displacementInput').value);
        if (displacementValue && displacementValue > 0) {
          run({ ...currentQuery.hints, displacement_l: displacementValue });
        }
      }
    }
    
    function answerEngineSeries(series) {
      if (series) {
        run({ ...currentQuery.hints, engine_series: series });
      } else {
        const inputSeries = $('#engineSeriesInput').value.trim();
        if (inputSeries) {
          run({ ...currentQuery.hints, engine_series: inputSeries });
        }
      }
    }
    
    function clearHint(hintName) {
      const newHints = { ...currentQuery.hints };
      delete newHints[hintName];
      run(newHints);
    }
    
    document.getElementById('btn').addEventListener('click', () => run());
  </script>
</body>
</html>
